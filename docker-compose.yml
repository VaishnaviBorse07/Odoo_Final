# Optional local PostgreSQL for ZenFlow V2.
# Backend: cd appointment_backend && python run_dev.py
# Frontend: cd appointment_frontend && npm run dev
#
# Point DATABASE_URL at this container, e.g.:
# postgresql://postgres:postgres@localhost:5432/zenflow_db

services:
  db:
    image: postgres:16-alpine
    container_name: zenflow_v2_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zenflow_db
    ports:
      - '5432:5432'
    volumes:
      - zenflow_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zenflow_v2_pg:
